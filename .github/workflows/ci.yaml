name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: sia-static-runners
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@ungdev": {
                  "authToken": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
      - run: pnpm lint

  build:
    runs-on: sia-static-runners
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@ungdev": {
                  "authToken": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
      - name: Switch env to production
        run: sed 's/NODE_ENV=development/NODE_ENV=production/g' .env.dist > .env.prod
      - run: pnpm build

  deploy:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
    environment: ${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
    runs-on: sia-static-runners
    needs:
      - lint
      - build
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install docker
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - run: cp .env.dist .env.prod
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_CAS_SERVICE_URL=${{ vars.CAS_SERVICE_URL }}
            NEXT_PUBLIC_ETUUTT_WEB_APPLICATION_ID=${{ vars.ETUUTT_WEB_APPLICATION_ID }}
            NEXT_PUBLIC_ASSOCIATION_NAME=${{ vars.ASSOCIATION_NAME }}
            NEXT_PUBLIC_ASSOCIATION_RNA=${{ vars.ASSOCIATION_RNA }}
            NEXT_PUBLIC_ASSOCIATION_RCS=${{ vars.ASSOCIATION_RCS }}
            NEXT_PUBLIC_ASSOCIATION_ADDRESS=${{ vars.ASSOCIATION_ADDRESS }}
            NEXT_PUBLIC_ASSOCIATION_PHONE=${{ vars.ASSOCIATION_PHONE }}
            NEXT_PUBLIC_ASSOCIATION_EMAIL=${{ vars.ASSOCIATION_EMAIL }}
            NEXT_PUBLIC_DPO_EMAIL=${{ vars.DPO_EMAIL }}
            NEXT_PUBLIC_DPO_NAME=${{ vars.DPO_NAME }}
            NEXT_PUBLIC_PUBLICATION_DIRECTOR=${{ vars.PUBLICATION_DIRECTOR }}
            NEXT_PUBLIC_API_VERSION=v1
            NEXT_PUBLIC_API_REQUEST_TIMEOUT=5000
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/etuutt/front:${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
