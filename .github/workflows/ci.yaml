name: CI
on:
  push:
    branches: [feat/test-ci]
  pull_request:
    branches: [feat/test-ci]

jobs:
  lint:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deploy-dev:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev') }}
    runs-on: self-hosted
    needs:
      - lint
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Install docker
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - run: cp .env.dist .env.prod
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://etu.dev.uttnetgroup.fr/api
            NEXT_PUBLIC_CAS_SERVICE_URL=https://etu.dev.uttnetgroup.fr/login
          tags: |
            ${{ secrets.REGISTRY_URL }}/etuutt/front:dev

  deploy-prod:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master') }}
    runs-on: self-hosted
    needs:
      - lint
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Install docker
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - run: cp .env.dist .env.prod
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://etu.utt.fr/api
            NEXT_PUBLIC_CAS_SERVICE_URL=https://etu.utt.fr/login
          tags: |
            ${{ secrets.REGISTRY_URL }}/etuutt/front:prod